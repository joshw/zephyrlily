# The lines below are called `modelines`. See `:help modeline`
# Feel free to remove those if you don't want/need to use them.
# yaml-language-server: $schema=https://goreleaser.com/static/schema.json
# vim: set ts=2 sw=2 tw=0 fo=cnqoj

version: 2

# The s.u13.net credential is compiled into release binaries (see
# internal/urlshorten, U13APIKey). It is declared here, defaulting to empty, so
# the ldflags template below resolves in a local `goreleaser build` too — where
# nothing exports it and an undefined .Env key would be a template error. CI
# passes the ZLILY_SHORTEN_API_KEY repository secret in through the environment.
# The rolling "dev" tag that carries prerelease dev builds is not a version.
# Left visible it becomes the nearest tag, and a snapshot then builds as
# "dev-SNAPSHOT-<sha>" instead of "<next version>-SNAPSHOT-<sha>".
git:
  ignore_tags:
    - dev

env:
  - ZLILY_SHORTEN_API_KEY={{ index .Env "ZLILY_SHORTEN_API_KEY" }}

before:
  hooks:
    # The browser build of the TUI, embedded by internal/webstatic.
    #
    # Deliberately without the u13APIKeyBuild ldflag the native builds carry: a
    # .wasm served to a browser is a public download, so a credential compiled
    # into it is readable by anyone who loads the page. The browser client
    # shortens through the proxy instead (internal/proxy/api/weburl.go), which
    # is where the key stays.
    - sh -c 'GOOS=js GOARCH=wasm go build -ldflags="-s -w" -o internal/webstatic/term/zlily.wasm ./cmd/zlily-wasm'

builds:
  - binary: zlily
    main: ./cmd/zlily
    env:
      - CGO_ENABLED=0
    goos:
      - linux
      - windows
      - darwin
    goarch:
      - arm64
      - amd64
      - "386"
    ldflags:
      - -s -w -X github.com/joshw/zephyrlily/internal/version.Version={{.Version}} -X github.com/joshw/zephyrlily/internal/urlshorten.u13APIKeyBuild={{.Env.ZLILY_SHORTEN_API_KEY}}

archives:
  - formats: [tar.gz]
    # this name template makes the OS and Arch compatible with the results of `uname`.
    name_template: >-
      {{ .ProjectName }}_
      {{- title .Os }}_
      {{- if eq .Arch "amd64" }}x86_64
      {{- else if eq .Arch "386" }}i386
      {{- else }}{{ .Arch }}{{ end }}
      {{- if .Arm }}v{{ .Arm }}{{ end }}
    # use zip for windows archives
    format_overrides:
      - goos: windows
        formats: [zip]

homebrew_casks:
  - name: zlily
    repository:
      owner: joshw
      name: homebrew-tap
      token: "{{ .Env.TAP_GITHUB_TOKEN }}"
    homepage: "https://github.com/joshw/zephyrlily"
    description: "Terminal UI client for the Lily chat server"
    # Unsigned binaries are quarantined by macOS Gatekeeper; strip the xattr on
    # install so `zlily` runs without a manual right-click "Open" override.
    hooks:
      post:
        install: |
          if system_command("/usr/bin/xattr", args: ["-h"]).exit_status == 0
            system_command "/usr/bin/xattr", args: ["-dr", "com.apple.quarantine", "#{staged_path}/zlily"]
          end

scoops:
  - repository:
      owner: joshw
      name: scoop-bucket
      token: "{{ .Env.TAP_GITHUB_TOKEN }}"
    homepage: "https://github.com/joshw/zephyrlily"
    description: "Terminal UI client for the Lily chat server"
    license: MPL-1.1

changelog:
  sort: asc
  filters:
    exclude:
      - "^docs:"
      - "^test:"

release:
  footer: >-

    ---

    Released by [GoReleaser](https://github.com/goreleaser/goreleaser).
