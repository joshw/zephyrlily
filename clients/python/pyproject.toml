[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "zlilybot"
version = "0.1.0"
description = "Write Lily chat bots against a zlily proxy"
readme = "README.md"
requires-python = ">=3.11"
license = "MPL-1.1"
dependencies = [
    "httpx>=0.27",
    "websockets>=13",
]

[project.urls]
Homepage = "https://github.com/joshw/zephyrlily"
Source = "https://github.com/joshw/zephyrlily/tree/main/clients/python"

[dependency-groups]
dev = [
    "pytest>=8",
    "pytest-asyncio>=0.23",
]

[tool.setuptools]
packages = ["zlilybot"]

[tool.pytest.ini_options]
asyncio_mode = "auto"
testpaths = ["tests"]
