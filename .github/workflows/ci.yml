name: CI

on:
  push:
    branches: ["*"]
  pull_request:
    branches: [main]

jobs:
  build-and-test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      - name: Set up Go
        uses: actions/setup-go@v6
        with:
          go-version-file: go.mod

      - name: Lint
        uses: golangci/golangci-lint-action@v9

      # The browser build shares every package with the native one, so it is
      # only ever one unguarded os/exec or signal call away from breaking.
      # Compiling it here keeps that from rotting unnoticed.
      - name: Build browser TUI (js/wasm)
        run: |
          GOOS=js GOARCH=wasm go build -ldflags="-s -w" \
            -o internal/webstatic/term/zlily.wasm ./cmd/zlily-wasm
          GOOS=js GOARCH=wasm go vet ./internal/... ./cmd/zlily-wasm

      - name: Build Go
        run: go build ./...

      - name: Vet
        run: go vet ./...

      # The browser client tests (internal/integration/browser_*_test.go) drive
      # the wasm build under Node; they skip themselves if it is absent. The
      # runner has Node from the setup step above, so they run here.
      - name: Test
        run: go test -count=1 ./...

  # The Python client library lives in this repo precisely so that a change to
  # internal/proxy/api and the client that consumes it are tested on the same
  # commit. Its suite runs against an in-process fake proxy, so it needs no Go
  # build and no Lily server.
  python-client:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: clients/python
    steps:
      - uses: actions/checkout@v7

      - name: Set up uv
        uses: astral-sh/setup-uv@v5
        with:
          enable-cache: true

      - name: Install
        run: uv sync --locked

      - name: Test
        run: uv run pytest -q
