# Build release-shaped binaries without cutting a release.
#
# Run it from the Actions tab ("Dev build" -> "Run workflow") and pick a branch.
# It produces the same archives a real release would, using GoReleaser's
# snapshot mode. The Homebrew and Scoop taps are untouched and no version is
# tagged — snapshot mode skips announce, publish and validate outright.
#
# The archives are attached to the run as artifacts, which GitHub will only
# serve to someone logged in, even for a public repository. To hand a build to
# someone who is not, "publish" also puts them on a rolling prerelease at the
# tag "dev", whose assets a public repository serves to anyone:
#
#   https://github.com/joshw/zephyrlily/releases/download/dev/zephyrlily_Linux_x86_64.tar.gz
#
# That tag is replaced by each run, so the URL is stable and always the most
# recent dev build. It is marked prerelease, so the newest real release stays
# the one GitHub calls Latest, and it does not match the v* pattern that starts
# the release workflow.
name: Dev build

on:
  workflow_dispatch:
    inputs:
      platforms:
        description: "Which platforms to build"
        type: choice
        default: all
        options:
          - all
          - linux-amd64-only
      publish:
        description: "Replace the public 'dev' prerelease with this build"
        type: boolean
        default: true

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest
    permissions:
      # Needed to replace the rolling dev prerelease. Read would be enough for
      # everything else here.
      contents: write
    steps:
      - uses: actions/checkout@v7
        with:
          # GoReleaser derives the snapshot version from the most recent tag,
          # so it needs the full history rather than a shallow clone.
          fetch-depth: 0

      - name: Set up Node.js
        uses: actions/setup-node@v6
        with:
          node-version: "24"
          cache: "npm"
          cache-dependency-path: web/package-lock.json

      - name: Set up Go
        uses: actions/setup-go@v6
        with:
          go-version-file: go.mod

      # Both before-hooks in .goreleaser.yaml run as part of this: the Svelte
      # build, and the GOOS=js GOARCH=wasm build of the browser client that the
      # binary embeds.
      - name: Build (all platforms)
        if: inputs.platforms == 'all'
        uses: goreleaser/goreleaser-action@v6
        with:
          distribution: goreleaser
          version: latest
          args: release --snapshot --clean
        env:
          # Compiled into the binary as the s.u13.net credential, exactly as a
          # release build does, so what is tested behaves like what ships.
          # Note this means the artifact carries the credential; it is the same
          # exposure as a published release, and only people with write access
          # can start this workflow.
          ZLILY_SHORTEN_API_KEY: ${{ secrets.ZLILY_SHORTEN_API_KEY }}

      # A single target builds in a fraction of the time, for when the point is
      # to try the change rather than to check every platform still compiles.
      - name: Build (linux/amd64 only)
        if: inputs.platforms == 'linux-amd64-only'
        uses: goreleaser/goreleaser-action@v6
        with:
          distribution: goreleaser
          version: latest
          args: build --snapshot --clean --single-target
        env:
          ZLILY_SHORTEN_API_KEY: ${{ secrets.ZLILY_SHORTEN_API_KEY }}

      - name: Report what was built
        run: |
          echo "### Dev build \`${GITHUB_REF_NAME}\` @ \`$(git rev-parse --short HEAD)\`" >> "$GITHUB_STEP_SUMMARY"
          echo '' >> "$GITHUB_STEP_SUMMARY"
          echo 'Not a release: nothing tagged, nothing published.' >> "$GITHUB_STEP_SUMMARY"
          echo '' >> "$GITHUB_STEP_SUMMARY"
          echo '```' >> "$GITHUB_STEP_SUMMARY"
          find dist -maxdepth 2 \( -name '*.tar.gz' -o -name '*.zip' -o -name 'zlily' -o -name 'zlily.exe' \) \
            -exec ls -lh {} \; | awk '{print $5, $9}' >> "$GITHUB_STEP_SUMMARY"
          echo '```' >> "$GITHUB_STEP_SUMMARY"

      # Only for a full build: the single-target path runs `goreleaser build`,
      # which produces bare binaries and no archives, and a dev release holding
      # one platform would be a trap for anyone who found it.
      - name: Publish to the rolling dev prerelease
        if: inputs.publish && inputs.platforms == 'all'
        run: |
          set -euo pipefail
          version=$(cd dist && ls *checksums.txt | sed 's/^zephyrlily_//; s/_checksums\.txt$//')

          # Replace rather than update: --cleanup-tag drops the old tag too, so
          # the new one points at this commit instead of wherever it was.
          gh release delete dev --yes --cleanup-tag 2>/dev/null || true

          gh release create dev \
            --prerelease \
            --target "${GITHUB_SHA}" \
            --title "Dev build ${version}" \
            --notes "Unreleased build of \`${GITHUB_REF_NAME}\` at ${GITHUB_SHA}, made by the Dev build workflow.

          Not a release: unversioned, untested beyond CI, and replaced by the next dev build. For a supported build see the [latest release](https://github.com/${GITHUB_REPOSITORY}/releases/latest)." \
            dist/*.tar.gz dist/*.zip dist/*checksums.txt

          echo '' >> "$GITHUB_STEP_SUMMARY"
          echo "Published to <https://github.com/${GITHUB_REPOSITORY}/releases/tag/dev> — downloadable without a GitHub account." >> "$GITHUB_STEP_SUMMARY"
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

      - name: Upload binaries
        uses: actions/upload-artifact@v4
        with:
          name: zlily-dev-${{ github.ref_name }}-${{ github.run_number }}
          # Archives when the whole matrix was built; the bare binary when only
          # one target was. Missing paths are not an error.
          path: |
            dist/*.tar.gz
            dist/*.zip
            dist/*checksums.txt
            dist/*/zlily
            dist/*/zlily.exe
          if-no-files-found: error
          # Long enough to test with, short enough not to accumulate: these are
          # ~390 MB per run for the full matrix.
          retention-days: 14
